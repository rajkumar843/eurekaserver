spring.application.name=eurekaserever

server.port=8761

# Disable fetching registry (server doesn't need to fetch from itself)
eureka.client.fetch-registry=false

# Disable registering with Eureka (server shouldn't register itself)
eureka.client.register-with-eureka=false

# Service URL (still required)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
